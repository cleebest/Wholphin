# Wholphin mpv configuration
# Based on dex2oat/mpv improvements (HarmonyOS customizations removed)

## OSC (On-Screen Controller)
# Wholphin uses its own UI overlay; built-in OSC is typically disabled.
# If re-enabled, these improved defaults apply:
# osc-deadzonesize=0.75        # larger deadzone prevents accidental triggers
# osc-dynamic_margins=yes      # margins follow OSC visibility
# osc-sub_margins=yes          # subtitles avoid OSC area
# osc-osd_margins=yes          # OSD messages avoid OSC area
# osc-windowcontrols_fullscreen=no

## Subtitle display
# Automatically adjust subtitle position to avoid overlapping with OSC
sub-use-margins=yes
sub-margin-y=0
osd-margin-y=0

## Video
# Use hardware decoding by default (can be toggled in Wholphin settings)
hwdec=mediacodec-copy
# Prefer gpu-next for improved HDR/color handling on supported devices
# vo=gpu-next

## Audio
audio-buffer=0.2
audio-stream-silence=yes

## Playback
cache=yes
cache-secs=300
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB

## Subtitles
sub-auto=fuzzy
sub-file-paths=subs
slang=eng,en,chi,zh

## Miscellaneous
keep-open=yes
save-position-on-quit=no
